name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.3, or major, minor or patch
        required: true
        default: patch

jobs:
  # The same checks as every push, on the commit being released.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      # HACS looks for the card in the latest release, which this run is about
      # to create, so the first release could never pass. Pushes still run it.
      skip_validate: true

  release:
    needs: ci
    uses: josa42/actions/.github/workflows/shared-ha-release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      version_files: |
        package.json: "version": "{version}"
      build: npm ci && npm run build
      files: dist/countdown-card.js
