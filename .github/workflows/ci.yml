name: CI

on:
  # Lets release.yml run these checks on the commit it releases.
  workflow_call:
    inputs:
      skip_validate:
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
  # Weekly, Sunday 00:00 UTC: catches upstream HACS breakage without a run a
  # day on a repo that goes quiet for months at a time.
  schedule:
    - cron: "0 0 * * 0"

jobs:
  ci:
    uses: josa42/actions/.github/workflows/shared-ha-plugin.yml@main
    with:
      # The card is bundled, so the source is checked instead of the file
      # hacs.json names.
      file: src/countdown-card.js
      skip_validate: ${{ inputs.skip_validate }}
